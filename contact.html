<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root{--bg:#ffffff;--text:#000000;--accent:#000EFF}
      body{background:var(--bg);color:var(--text);padding-bottom:80px}
      .navbar,.footer{background:var(--text)}
      .footer{position:fixed;left:0;right:0;bottom:0;height:60px}
      .nav-link{color:var(--bg) !important}
      .btn-accent{background:var(--accent);color:#fff;border:none}
      .section{padding:80px 0}
      a.accent{color:var(--accent)}
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Portfolio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navmenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home / Over mij</a></li>
            <li class="nav-item"><a class="nav-link" href="projects.html">Portfolio / Projecten</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">Over deze site</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <section id="contact" class="section">
      <div class="container">
        <h2>Contactinformatie</h2>
        <p>Heb je een vraag? Stuur een bericht via het formulier hieronder of mail naar <a class="accent" href="mailto:keanu.sewpal@example.com">keanu.sewpal@gmail.com</a>.</p>
        <div class="row">
          <div class="col-md-6">
            <form>
              <div class="mb-3">
                <label class="form-label">Naam</label>
                <input class="form-control" placeholder="Je naam">
              </div>
              <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input class="form-control" type="email" placeholder="naam@voorbeeld.nl">
              </div>
              <div class="mb-3">
                <label class="form-label">Bericht</label>
                <textarea class="form-control" rows="4"></textarea>
              </div>
              <button type="submit" class="btn btn-accent">Verstuur</button>
            </form>
          </div>
          <div class="col-md-6">
            <h5>Overige contactopties</h5>
            <ul>
              <li>GitHub: <a class="accent" href="https://github.com/keanu050" target="_blank">github.com/keanu050</a></li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer text-center py-3">
      <div class="container text-white">&copy; 2026 Keanu — Portfolio</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
