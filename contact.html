<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root{--bg:#1a1a1a;--text:#ffffff;--accent:#cccccc}
      body{background:var(--bg);color:var(--text);padding-bottom:80px}
      .navbar,.footer{background:#0a0a0a}
      .footer{position:fixed;left:0;right:0;bottom:0;height:60px}
      .nav-link{color:#ffffff !important}
      .btn-accent{background:var(--accent);color:#000;border:none;transition:all 0.3s;}
      .btn-accent:hover{transform:scale(1.05);box-shadow:0 0 15px rgba(204, 204, 204, 0.6);}
      .section{padding:80px 0}
      a.accent{color:var(--accent);cursor:pointer;transition:all 0.3s;}
      a.accent:hover{text-shadow:0 0 10px rgba(204, 204, 204, 0.8);}
      .card{background:#2a2a2a !important;border:none !important;color:var(--text) !important;transition:all 0.3s;cursor:pointer;}
      .card:hover{transform:translateY(-5px);box-shadow:0 10px 30px rgba(204, 204, 204, 0.3);}
      .form-control{background:#2a2a2a;border:1px solid #cccccc;color:var(--text);}
      .form-control:focus{background:#2a2a2a;border-color:#cccccc;color:var(--text);box-shadow:0 0 10px rgba(204, 204, 204, 0.3);}
      .form-label{color:var(--text);}
      .interactive-text{position:relative;display:inline-block;}
      .tooltip-popup{position:absolute;background:#cccccc;color:#000;padding:8px 12px;border-radius:6px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(-10px) translateX(-50%);transition:all 0.3s;z-index:1000;left:50%;bottom:110%;}
      .interactive-text:hover .tooltip-popup{opacity:1;transform:translateY(-5px) translateX(-50%);}
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Portfolio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navmenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home / Over mij</a></li>
            <li class="nav-item"><a class="nav-link" href="projects.html">Portfolio / Projecten</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">Over deze site</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <section id="contact" class="section">
      <div class="container">
        <h2>Contactinformatie</h2>
        <p>Heb je een vraag? Stuur een bericht via het formulier hieronder of mail naar <a class="accent" href="mailto:keanu.sewpal@example.com">keanu.sewpal@gmail.com</a>.</p>
        <div class="row">
          <div class="col-md-6">
            <form>
              <div class="mb-3">
                <label for="name" class="form-label">Naam</label>
                <input id="name" name="name" class="form-control" placeholder="Je naam" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input id="email" name="email" class="form-control" type="email" placeholder="naam@voorbeeld.nl" required>
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Bericht</label>
                <textarea id="message" name="message" class="form-control" rows="4" required></textarea>
              </div>
              <button type="submit" class="btn btn-accent">Verstuur</button>
            </form>
          </div>
          <div class="col-12 col-md-6">
            <h5>Overige contactopties</h5>
            <ul>
              <li>GitHub: <a class="accent" href="https://github.com/keanu050" target="_blank">github.com/keanu050</a></li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer text-center py-3">
      <div class="container text-white">&copy; 2026 Keanu — Portfolio</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
